name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm test:indexer
      - run: pnpm test:web
      - run: pnpm test:cre
      - run: pnpm -r exec tsc --noEmit
      - run: pnpm --filter @backstop/web build

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Dependencies
        run: |
          cd contracts
          forge install foundry-rs/forge-std@v1.16.2 --no-git
          forge install OpenZeppelin/openzeppelin-contracts@v5.4.0 --no-git
      - name: Build
        run: forge build --root contracts
      - name: Test
        run: forge test --root contracts -vv
      - name: Invariants
        run: forge test --root contracts --match-contract InvariantsTest

  indexer-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install the standalone indexer dependencies
        working-directory: indexer
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate the event and entity types
        working-directory: indexer
        run: node node_modules/envio/bin.mjs codegen
      - name: Check handlers against generated types
        working-directory: indexer
        run: node node_modules/typescript/bin/tsc --noEmit

  differential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Dependencies
        run: |
          cd contracts
          forge install foundry-rs/forge-std@v1.16.2 --no-git
          forge install OpenZeppelin/openzeppelin-contracts@v5.4.0 --no-git
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @backstop/core build
      - name: Regenerate the cross-implementation vectors
        run: pnpm --filter @backstop/core run vectors
      - name: Assert the Solidity adjudicator reproduces every integer
        run: forge test --root contracts --match-contract DifferentialTest -vv
      - name: Fail if the vectors drifted
        run: git diff --exit-code contracts/vectors/

  gate-zero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @backstop/core build
      - name: Lifetime Type-I bound
        run: pnpm --filter @backstop/core exec tsx scripts/gate-zero.ts --trials 200 --pools 4

  # The audit, against an endpoint this repository stands up itself, on both the attested
  # precision and the substitution. This is the whole product path in one job: the published
  # CLI, the sampling contract the attestation pinned, the same normalization, the same engine.
  # Both directions are asserted, because a detector that fires on everything is as useless as
  # one that fires on nothing.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @backstop/core build
      - run: pnpm --filter @backstop/sdk build
      - run: pnpm --filter @backstop/cli build
      - name: The attested precision must not cross, the substitution must
        run: node scripts/ci-audit.mjs --rounds 6 --draws 96
      - name: A restarted campaign must preserve evidence and consume interrupted slices
        run: node scripts/check-campaign-resume.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: audit-verdicts
          path: docs/results/ci/
          if-no-files-found: warn
