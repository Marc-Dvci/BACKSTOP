name: "BACKSTOP audit"
description: "Fail the build when the inference endpoint has departed from the envelope your evaluation was run against."
branding:
  icon: shield
  color: green

inputs:
  attestation:
    description: "Path to the attestation configuration, relative to your workspace."
    required: true
  pool:
    description: "Path to the committed reference pool, relative to your workspace."
    required: true
  base-url:
    description: "OpenAI-compatible base URL of the endpoint under audit. Defaults to the URL the attestation names."
    required: false
    default: ""
  model:
    description: "Model slug to request. Defaults to the slug the attestation names."
    required: false
    default: ""
  api-key:
    description: "Credential for the endpoint. Use a probe-scoped key with a spend cap."
    required: false
  rounds:
    description: "Audit rounds to run."
    required: false
    default: "1"
  draws:
    description: "Optional consistency check; must equal the attestation's committed n."
    required: false
    default: ""
  report:
    description: "Where to write the machine-readable verdict."
    required: false
    default: "backstop-verdict.json"
  campaign-state:
    description: "Optional restored campaign JSON. Serialize jobs and retain the updated file to continue one lifetime across runs."
    required: false
    default: ""
  fail-on-cross:
    description: >-
      Fail the job when the evidence crosses the precommitted boundary. Set to false to record
      the verdict without failing, which is how a team adopts the audit before trusting it to
      gate a release.
    required: false
    default: "true"
  upload-report:
    description: "Upload the verdict as a build artifact."
    required: false
    default: "true"

outputs:
  crossed:
    description: "true when the evidence crossed the precommitted boundary"
    value: ${{ steps.audit.outputs.crossed }}
  log-m:
    description: "log M at the last round, RAY scale"
    value: ${{ steps.audit.outputs.log-m }}
  crossed-at:
    description: "the round the boundary was crossed at, empty when it was not"
    value: ${{ steps.audit.outputs.crossed-at }}
  report:
    description: "path to the machine-readable verdict"
    value: ${{ steps.audit.outputs.report }}

runs:
  using: composite
  steps:
    # The CLI is built from the action's own checkout, never from the caller's workspace.
    # GitHub places the whole repository behind GITHUB_ACTION_PATH, so `..` is the BACKSTOP
    # root whether this action was referenced as `owner/BACKSTOP/action@ref` or as `./action`
    # from inside the repository itself. Building from the caller's tree would install their
    # dependencies against our lockfile, which is why this step is not simply `pnpm install`.
    - name: Build the CLI
      id: build
      shell: bash
      env:
        BACKSTOP_ROOT: ${{ github.action_path }}/..
      run: |
        set -euo pipefail
        root="$(cd "$BACKSTOP_ROOT" && pwd)"
        echo "root=$root" >> "$GITHUB_OUTPUT"

        if [ -f "$root/packages/cli/dist/index.js" ]; then
          echo "the CLI is already built"
        else
          corepack enable
          corepack prepare "$(node -p "require('$root/package.json').packageManager")" --activate
          # Only the CLI and what it depends on. The web app and the contracts have no part in
          # an audit, and a CI job should not install a Next.js toolchain to send HTTP requests.
          pnpm --dir "$root" install --frozen-lockfile --filter "@backstop/cli..."
          pnpm --dir "$root" --filter @backstop/core build
          pnpm --dir "$root" --filter @backstop/sdk build
          pnpm --dir "$root" --filter @backstop/cli build
        fi

        test -f "$root/packages/cli/dist/index.js" || {
          echo "::error::the CLI did not build at $root/packages/cli/dist/index.js"
          exit 2
        }

    # Run from the caller's workspace, so `attestation` and `pool` resolve against their
    # repository rather than against ours.
    - name: Audit
      id: audit
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        BACKSTOP_API_KEY: ${{ inputs.api-key }}
        BACKSTOP_CLI: ${{ steps.build.outputs.root }}/packages/cli/dist/index.js
        REPORT: ${{ inputs.report }}
        ATTESTATION: ${{ inputs.attestation }}
        POOL: ${{ inputs.pool }}
        ROUNDS: ${{ inputs.rounds }}
        DRAWS: ${{ inputs.draws }}
        BASE_URL: ${{ inputs.base-url }}
        MODEL: ${{ inputs.model }}
        CAMPAIGN_STATE: ${{ inputs.campaign-state }}
        FAIL_ON_CROSS: ${{ inputs.fail-on-cross }}
      run: |
        # GitHub invokes a composite run step with `bash -e`, and the CLI's exit code is the
        # verdict rather than a failure, so `-e` has to go before the audit runs. Every exit
        # below is then explicit.
        set +e
        set -uo pipefail

        if [ "$FAIL_ON_CROSS" != "true" ] && [ "$FAIL_ON_CROSS" != "false" ]; then
          echo "::error::fail-on-cross must be true or false"
          exit 2
        fi

        if [[ "$REPORT" == *$'\n'* || "$REPORT" == *$'\r'* || "$REPORT" == /* || "$REPORT" == *..* || -z "$REPORT" ]]; then
          echo "::error::report must be a relative workspace path without parent traversal or newlines"
          exit 2
        fi
        rm -f -- "$REPORT"
        args=(audit --attestation "$ATTESTATION" --pool "$POOL" --rounds "$ROUNDS" --json "$REPORT")
        [ -n "$DRAWS" ] && args+=(--draws "$DRAWS")
        # An empty base-url or model means "use what the attestation names", which is the
        # common case: the attestation already pins the endpoint it was measured against.
        [ -n "$BASE_URL" ] && args+=(--base-url "$BASE_URL")
        [ -n "$MODEL" ] && args+=(--model "$MODEL")
        [ -n "$CAMPAIGN_STATE" ] && args+=(--state "$CAMPAIGN_STATE")

        node "$BACKSTOP_CLI" "${args[@]}"
        code=$?
        if [ "$code" != "0" ] && [ "$code" != "1" ]; then
          echo "::error::the audit could not complete (exit $code)"
          exit 2
        fi
        if [ ! -f "$REPORT" ]; then
          echo "::error::the audit did not produce a verdict"
          exit 2
        fi

        verdict="$(node -e '
          const fs = require("node:fs");
          const v = JSON.parse(fs.readFileSync(process.env.REPORT, "utf8"));
          if (typeof v.crossed !== "boolean" || typeof v.logMRay !== "string" || !/^-?\d+$/.test(v.logMRay)
            || (v.crossed && (!Number.isSafeInteger(v.crossedAt) || v.crossedAt < 0))
            || (!v.crossed && v.crossedAt != null)) process.exit(2);
          console.log(v.crossed, v.logMRay, v.crossedAt ?? "-");
        ')" || { echo "::error::invalid audit verdict"; exit 2; }
        read -r crossed logm at <<<"$verdict"
        if { [ "$code" = "0" ] && [ "$crossed" != "false" ]; } || { [ "$code" = "1" ] && [ "$crossed" != "true" ]; }; then
          echo "::error::CLI exit code and verdict disagree"
          exit 2
        fi
        [ "$at" = "-" ] && at=""
        echo "report=$REPORT" >> "$GITHUB_OUTPUT"
        echo "crossed=$crossed" >> "$GITHUB_OUTPUT"
        echo "log-m=$logm" >> "$GITHUB_OUTPUT"
        echo "crossed-at=$at" >> "$GITHUB_OUTPUT"

        # Exit 2 is "the run could not complete" and always fails the job: a job that goes
        # green because the endpoint was unreachable is the failure mode this action exists to
        # prevent. Exit 1 is a verdict, and whether a verdict fails the build is the caller's
        # policy.
        if [ "$code" = "2" ]; then
          echo "::error::the audit could not complete"
          exit 2
        fi
        if [ "$code" = "1" ]; then
          echo "::error::the endpoint has departed from the envelope its attestation committed to (crossed at round $at)"
          if [ "$FAIL_ON_CROSS" = "true" ]; then exit 1; fi
        fi
        exit 0

    - name: Summarise
      if: always()
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        REPORT: ${{ inputs.report }}
        CROSSED: ${{ steps.audit.outputs.crossed }}
        CROSSING_ROUND: ${{ steps.audit.outputs.crossed-at }}
        ROUNDS: ${{ inputs.rounds }}
        ATTESTATION: ${{ inputs.attestation }}
        DRAWS: ${{ inputs.draws }}
        LOG_M: ${{ steps.audit.outputs.log-m }}
      run: |
        {
          echo "### BACKSTOP audit"
          echo ""
          if [ -n "$CROSSED" ]; then
            if [ "$CROSSED" = "true" ]; then
              echo "**Crossed** at round $CROSSING_ROUND. The endpoint has departed from the envelope its attestation committed to."
            else
              echo "**No crossing observed** in the recorded campaign."
            fi
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| attestation | \`$ATTESTATION\` |"
            echo "| rounds | $ROUNDS |"
            echo "| draws per cell | ${DRAWS:-committed n} |"
            echo "| log M, RAY scale | \`$LOG_M\` |"
          else
            echo "The audit produced no verdict."
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload the verdict
      if: always() && inputs.upload-report == 'true' && steps.audit.outputs.report != ''
      uses: actions/upload-artifact@v7
      with:
        name: backstop-verdict
        path: ${{ steps.audit.outputs.report }}
        if-no-files-found: warn
