# Envio HyperIndex configuration for BACKSTOP.
#
# The index is the product's public face: it turns a stream of round closures into the two
# running products, the derived reliability and price index, the realised detection delay, and
# the correlation structure the underwriting side needs. Every entity in schema.graphql past
# the identifiers is derived or aggregated rather than a mirror of an event.
#
# Event signatures resolve from the compiled ABIs in `abis/`, so a contract change that moves a
# parameter breaks codegen rather than silently indexing the wrong field.
#
# Addresses are written by scripts/sync-deployment.mjs after deployment.
name: backstop
description: Capital-backed verification for hosted AI inference

# New deployments publish committed counts in VersionConfigured and RoundScheduled. Direct
# historical openRound calldata remains a fallback; absent metadata is represented as unknown.
field_selection:
  transaction_fields:
    - input

contracts:
  - name: AttestationRegistry
    abi_file_path: abis/AttestationRegistry.json
    events:
      - event: VersionIssued
      - event: VersionConfigured
      - event: VersionRetired
      - event: VersionSuspended
      - event: VersionResumed
      - event: IssuerRegistered
  - name: AuditRegistry
    abi_file_path: abis/AuditRegistry.json
    events:
      - event: RoundOpened
      - event: RoundScheduled
      - event: RoundSealed
      - event: RoundClosed
  - name: PolicyRegistry
    abi_file_path: abis/PolicyRegistry.json
    events:
      - event: PolicyPurchased
      - event: PolicyExpired
      - event: PolicySettled
      - event: CredentialEnrolled
  - name: CoveragePool
    abi_file_path: abis/CoveragePool.json
    events:
      - event: Deposited
      - event: Withdrawn
      - event: Reserved
      - event: Released
      - event: PaidOut
  - name: Settlement
    abi_file_path: abis/Settlement.json
    events:
      - event: ClaimRootPublished
      - event: ChallengeUpheld
      - event: ChallengeRejected
      - event: Redeemed
      - event: BatchSettled
      - event: IssuerBonded
  - name: TicketRegistry
    abi_file_path: abis/TicketRegistry.json
    events:
      - event: ProducerRegistered
      - event: ProducerSlashed
      - event: TicketReserved
      - event: TicketPublished
      - event: TicketVoided

chains:
  - id: 10143 # Monad testnet
    # The block the six contracts were deployed in. Starting at genesis would scan 60 million
    # blocks to reach the first event that matters.
    start_block: 60253947
    # RPC as the data source, so the indexer runs with no account anywhere. HyperSync is
    # faster and is a one-line swap once an Envio API token is set (config.hypersync.yaml).
    #
    # The backfill needs archive logs from the deployment block. Monad's own public endpoint
    # caps eth_getLogs at a 100-block range, and every free endpoint answers a concurrent
    # backfill with 429s. So the sync RPC is `rpc-cache.mjs`, a service in docker-compose.yml
    # that scans the six contracts' logs once, sequentially, keeps them with a watermark, and
    # answers eth_getLogs over any range from that file. The range ceiling is wide because the
    # answer comes from memory. A later run scans only the blocks after the watermark.
    rpc:
      - url: http://rpc-cache:8545
        for: sync
        initial_block_interval: 250000
        interval_ceiling: 250000
        acceleration_additive: 0
        backoff_millis: 2000
    contracts:
      - name: AttestationRegistry
        address:
          - 0x72193621705c660ffca7a8AFd3338EccB31571e8
      - name: AuditRegistry
        address:
          - 0xcacFf7F418F92C160f270f6B4Db3B00fD739872F
      - name: PolicyRegistry
        address:
          - 0x8d6e370b95A783B983e40468413227ad94b03902
      - name: CoveragePool
        address:
          - 0xA29548deCABE4c5A07461D00B7ED26dfFb10BA4e
      - name: Settlement
        address:
          - 0x9d344c625D7D62FA43ebc97528213B666893082B
      - name: TicketRegistry
        address:
          - 0xa91Ee747C648c8a6f9418FaB1C21b7f00DC441C3
