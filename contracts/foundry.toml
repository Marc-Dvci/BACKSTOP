[profile.default]
src = "src"
out = "out"
libs = ["lib"]
deny_warnings = false
test = "test"
script = "script"
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [
  { access = "read", path = "./vectors" },
  { access = "read-write", path = "./deployments" },
]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = false

[rpc_endpoints]
monad_testnet = "${MONAD_TESTNET_RPC}"
monad_mainnet = "${MONAD_MAINNET_RPC}"

[etherscan]
monad_testnet = { key = "${MONAD_EXPLORER_KEY}", url = "https://sourcify-api-monad.blockvision.org" }
