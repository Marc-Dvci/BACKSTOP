# Shared settings for every workflow in this project.
#
# The audit runs on Monad testnet, which the CRE CLI lists from v1.30.0 and the TypeScript SDK
# carries a chain selector for.
monad-testnet-settings:
  account:
    workflow-owner-address: ${CRE_WORKFLOW_OWNER}
  rpcs:
    - chain-name: monad-testnet
      url: ${MONAD_TESTNET_RPC}
